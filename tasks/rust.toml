# Rust check, lint, and format tasks

["rust:check"]
description = "Check all Rust crates for errors"
run = "cargo check --workspace"
hide = true

["rust:lint"]
description = "Lint Rust code with Clippy"
run = "cargo clippy --workspace --all-targets"
hide = true

["rust:format"]
description = "Format Rust code"
run = "cargo fmt --all"
hide = true

["rust:format:check"]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"
hide = true

["build:cli"]
description = "Build the openshell CLI and install to .venv/bin/"
run = [
  "cargo build -p openshell-cli --release",
  """
  VENV_BIN="$(git rev-parse --show-toplevel)/.venv/bin"
  if [ -d "$VENV_BIN" ]; then
    cp target/release/openshell "$VENV_BIN/openshell"
    echo "Installed to $VENV_BIN/openshell"
  fi
  """,
]
